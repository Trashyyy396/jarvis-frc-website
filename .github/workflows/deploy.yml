name: Deploy Jarvis to /jarvis

on:
  push:
    branches:
      - main

env:
  FIREBASE_PROJECT_ID: wheelhouse-foundation-website
  FIREBASE_SITE_ID: wheelhouse-foundation-website
  FIREBASE_LIVE_ORIGIN: https://wheelhouse-foundation-website.web.app

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT."
            echo "Create a Firebase service account JSON key and add the full file contents as a repository secret."
            echo "See docs/SETUP_SECRETS.md in this repo for step-by-step instructions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Prepare merged deploy bundle
        env:
          FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT_ID }}
          FIREBASE_SITE_ID: ${{ env.FIREBASE_SITE_ID }}
          FIREBASE_LIVE_ORIGIN: ${{ env.FIREBASE_LIVE_ORIGIN }}
        run: npm run prepare-deploy

      - name: Deploy to Firebase Hosting
        working-directory: deploy
        run: npx firebase-tools@latest deploy --only hosting --project "${{ env.FIREBASE_PROJECT_ID }}"
